services:
  postgres:
    image: postgres:17
    container_name: interviewiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - interviewiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewiq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  interviewiq-postgres-data:
